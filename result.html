<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>付款結果 — 榮枯有時</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #fbeddc;
      font-family: 'Noto Serif TC', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.8rem;
      width: 100%;
      max-width: 640px;
      animation: up .6s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo { width: min(300px, 72vw); }
    .logo svg { width: 100%; height: auto; display: block; }
    .msg {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
    }
    .msg h1 {
      font-size: clamp(1.2rem, 4vw, 1.7rem);
      font-weight: 400;
      color: #2e2e2e;
      letter-spacing: .04em;
      line-height: 1.6;
    }
    .msg p.desc {
      font-size: clamp(.8rem, 2.4vw, .92rem);
      color: #777;
      letter-spacing: .02em;
      line-height: 1.8;
    }
    p.err {
      font-size: clamp(.78rem, 2.2vw, .88rem) !important;
      color: #e3836c !important;
      letter-spacing: .05em !important;
      min-height: 1.3em;
      font-family: 'Noto Serif TC', serif;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      background: #8ea68e;
      color: #fff;
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(.92rem, 2.6vw, 1.05rem);
      font-weight: 400;
      letter-spacing: .1em;
      padding: .88rem 2.5rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: none;
      -webkit-tap-highlight-color: transparent;
      transition: background .28s, transform .22s;
    }
    .btn:hover, .btn:active {
      background: #7a9480;
      transform: translateY(-3px);
    }
    .btn:disabled {
      background: #b5c9b5;
      transform: none;
      cursor: not-allowed;
    }
    .btn .arrow {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      transition: transform .22s;
    }
    .btn:hover .arrow, .btn:active .arrow {
      transform: translateX(4px);
    }
    .btn.hidden { display: none; }
  </style>
</head>

  <div class="msg">
    <h1>Oops！發生不明原因付款未成功</h1>
    <p class="desc">請重新點擊付款連結再試一次，若持續失敗<br>請聯繫您的發卡銀行或改用匯款方式付款 🤍</p>
    <p class="err" id="err"></p>
  </div>
  <button id="retry-btn" class="btn hidden" onclick="retryPayment()">
    重新付款
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>
  </button>
</div>
<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbyAeMvhJ6ye3so25B64rvslzkgdGV81OGnWbVwSCaZPO_4sSrkKdxfhjBBIkqkFkmCKyg/exec';
  var params  = new URLSearchParams(window.location.search);
  var rtnCode = params.get('RtnCode') || '';
  var rtnMsg  = params.get('RtnMsg')  || '';
  var sid     = params.get('sid')     || '';
  var errEl   = document.getElementById('err');
  var btn     = document.getElementById('retry-btn');

  if (rtnCode && rtnCode !== '1') {
    var msg = rtnMsg ? decodeURIComponent(rtnMsg) : '';
    errEl.textContent = '錯誤代碼：' + rtnCode + (msg ? '　' + msg : '');
    errEl.style.color = '#e3836c';
  }

  if (sid) {
    btn.classList.remove('hidden');
  }

  function retryPayment() {
    btn.disabled = true;
    btn.textContent = '產生付款連結中…';

    fetch(GAS_URL + '?sid=' + encodeURIComponent(sid))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.payUrl) {
          window.location.href = data.payUrl;
        } else {
          btn.disabled = false;
          btn.innerHTML = '重新付款 <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
          errEl.textContent = '產生連結失敗，請聯繫我們';
          errEl.style.color = '#e3836c';
        }
      })
      .catch(function() {
        btn.disabled = false;
        btn.innerHTML = '重新付款 <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
        errEl.textContent = '網路錯誤，請稍後再試';
        errEl.style.color = '#e3836c';
      });
  }
</script>
